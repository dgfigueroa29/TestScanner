[versions]
# Toolchain
#
# Kotlin 2.3.20 no es un capricho: es el suelo que impone consumir zxing-cpp (ADR-0008). Sus klibs
# publicados están compilados con 2.2.0 y un compilador no lee klibs de uno más nuevo. Se eligió
# exactamente 2.3.20 —y no la 2.3.21— porque es la versión con la que están compilados Compose
# Multiplatform 1.11.1, Koin 4.2.2 y KSP 2.3.10: emparejar exacto reduce la
# superficie de fallo en un build que todavía no se ha podido ejecutar.
#
# AGP estuvo en 8.9.2 mientras no hubo forma de contrastarlo: vive en el maven de Google,
# inalcanzable desde el entorno de desarrollo, así que subirlo habría sido adivinar un número. Ese
# era el riesgo R11 del SDD, y el primer CI lo confirmó con el número exacto:
#
#     Failed to apply plugin 'com.google.devtools.ksp'.
#     > The minimum supported AGP version is 8.10.0.
#
# Se sube a 8.10.0 y no más: es el mínimo que KSP 2.3.10 exige —lo dice su propio mensaje, así que
# no hay que suponer que la versión exista— y el salto más corto desde 8.9.2. Subir de más
# introduciría cambios de comportamiento que nadie ha pedido en una build que apenas empieza a
# compilar. Gradle 8.14.5 cumple de sobra el mínimo que AGP 8.10 pide.
kotlin = "2.3.20"
agp = "8.10.0"
composeMultiplatform = "1.11.1"
jvmTarget = "17"

# Android SDK
compileSdk = "35"
minSdk = "24"
targetSdk = "35"

# Kotlin ecosystem
coroutines = "1.11.0"
serialization = "1.11.0"

# AndroidX / Jetbrains multiplatform
androidxActivityCompose = "1.10.1"
androidxCoreKtx = "1.15.0"
# La que pide Koin 4.2.2; subirla más alto haría que Gradle resolviera por encima de lo que espera.
lifecycle = "2.9.6"

# DI
koin = "4.2.2"

# Persistencia
multiplatformSettings = "1.3.0"
# Sin verificar contra KSP 2.3.10: androidx.room solo se publica en el maven de Google.
room = "2.7.2"
sqlite = "2.5.2"
# KSP cambió de esquema de versiones: 2.3.10 es la compilada contra Kotlin 2.3.20.
ksp = "2.3.10"

# Test
turbine = "1.2.1"

# Quality
detekt = "1.23.8"

# Fase 2+ — declarados aquí para que el catálogo sea la única fuente de versiones
playServicesCodeScanner = "16.1.0"
mlkitBarcode = "17.3.0"
mlkitTextRecognition = "16.0.1"
camerax = "1.4.2"
# Baseline de comparación: dos artefactos distintos del mismo proyecto (ADR-0008).
zxingcpp = "3.1.1"
# ZXing en Java puro, para escritorio. Otro proyecto que el anterior pese al nombre: este es el
# original en Java, no el port a C++ (deuda D13).
zxingJava = "3.5.4"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }

lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-test = { module = "io.insert-koin:koin-test" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }

multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }
multiplatform-settings-test = { module = "com.russhwolf:multiplatform-settings-test", version.ref = "multiplatformSettings" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

# Artefactos de los plugins, para que build-logic pueda compilar los convention plugins
gradlePlugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
gradlePlugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-compose = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
gradlePlugin-composeCompiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# Fase 2+ — todavía no consumidos por ningún módulo
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "playServicesCodeScanner" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

zxingcpp-android = { module = "io.github.zxing-cpp:android", version.ref = "zxingcpp" }
zxingcpp-native = { module = "io.github.zxing-cpp:kotlin-native", version.ref = "zxingcpp" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxingJava" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
