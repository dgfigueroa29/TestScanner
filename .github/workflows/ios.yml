name: iOS (manual)

# Workflow aparte y **solo manual**, a propósito.
#
# La Fase 3 está despriorizada (ver `docs/ROADMAP.md`): sin dispositivos Apple no se puede *probar*
# nada de iOS, así que enlazar el framework comprueba que el Kotlin/Native compila y nada más. Eso
# es información útil, pero no es un criterio para aceptar o rechazar un cambio de Android, Desktop
# o Web — y mientras vivió dentro de `Verify` lo era: dejaba `main` en rojo por una plataforma que
# nadie puede ejecutar, y ese rojo permanente le quita el significado al resto de los checks.
#
# Sacarlo tiene un coste que conviene tener presente: el código de iOS vuelve a quedar sin
# verificación automática, que es justo lo que dejó pasar el `Cannot access 'val IO': it is
# internal` durante toda una tanda. La contrapartida es que se lanza a mano cuando se vaya a tocar
# iOS, y de forma obligada antes de retomar la Fase 3.
#
# Cómo lanzarlo: pestaña Actions → "iOS (manual)" → Run workflow. O `gh workflow run ios.yml`.

on:
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.welcome=never

jobs:
  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
